file: 15_firewall_internal_log.md
kind: firewall_session
line_regex: '^((?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?P<device>\S+) (?P<action>\S+) (?P<proto>\S+) (?P<src_ip>[^: ]+):(?P<src_port>\d+) -> (?P<dst_ip>[^: ]+):(?P<dst_port>\d+) (?P<rest>.*))$'
kv_rest: true
ts_format: '%Y-%m-%d %H:%M:%S'
timezone: PKT
ts_means: close
duration_field: duration_s
untrusted_fields: []
int_fields: [src_port, dst_port]
strip_suffix: {duration_s: s}

